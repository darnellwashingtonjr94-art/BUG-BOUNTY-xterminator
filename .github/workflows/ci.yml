name: CI Quality & Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest asyncpg redis httpx scikit-learn numpy google-genai

      - name: Lint Python Code
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other errors as warnings
          flake8 . --count --exit-zero --max-complexity=127 --statistics

      - name: Set up Node.js for Reporter Dashboard
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies & Build Dashboard
        run: |
          cd apps/reporter
          npm cache clean --force
          npm install
          npm run build

      - name: Test Docker Compose Configuration
        run: docker compose config
