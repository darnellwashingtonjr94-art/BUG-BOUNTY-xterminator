name: Generate Video PoCs Pipeline

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      start_idx:
        description: 'Start script index'
        required: false
        default: '1'
      end_idx:
        description: 'End script index'
        required: false
        default: '40'
      concurrency:
        description: 'Max parallel API requests'
        required: false
        default: '30'

jobs:
  generate-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Ensure Pipeline Script Exists
        run: |
          mkdir -p packages/video-gen
          cat << 'EOF' > packages/video-gen/run_pipeline.sh
          #!/usr/bin/env bash
          set -euo pipefail
          START_IDX="${START_IDX:-1}"
          END_IDX="${END_IDX:-40}"
          CONCURRENCY="${CONCURRENCY:-30}"
          BATCH_OUTPUT="${BATCH_OUTPUT:-batch_jobs.json}"
          DOWNLOAD_DIR="${DOWNLOAD_DIR:-packages/video-gen/downloads}"
          POLL_INTERVAL="${POLL_INTERVAL:-15}"

          echo "[PIPELINE] Starting batch submissions for scripts ${START_IDX} to ${END_IDX}..."
          python3 packages/video-gen/run_batch.py \
              --start "${START_IDX}" \
              --end "${END_IDX}" \
              --concurrency "${CONCURRENCY}" \
              --output "${BATCH_OUTPUT}"

          echo "[PIPELINE] Polling and downloading generated videos..."
          python3 packages/video-gen/poll_and_download.py \
              --input "${BATCH_OUTPUT}" \
              --output-dir "${DOWNLOAD_DIR}" \
              --interval "${POLL_INTERVAL}"
          echo "[SUCCESS] Pipeline complete!"
          EOF
          chmod +x packages/video-gen/run_pipeline.sh

      - name: Execute Video Pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          START_IDX: ${{ inputs.start_idx || '1' }}
          END_IDX: ${{ inputs.end_idx || '40' }}
          CONCURRENCY: ${{ inputs.concurrency || '30' }}
          DOWNLOAD_DIR: 'packages/video-gen/downloads'
        run: |
          ./packages/video-gen/run_pipeline.sh

      - name: Upload Generated Videos as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-pocs-${{ github.run_id }}
          path: packages/video-gen/downloads/*.mp4
          retention-days: 7

      - name: Send Discord Webhook Notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            COLOR=3066993
            TITLE="✅ Veo 3 Video PoC Pipeline Completed"
          else
            COLOR=15158332
            TITLE="❌ Veo 3 Video PoC Pipeline Failed"
          fi

          # Added -g flag to curl to prevent bracket parsing errors!
          curl -g -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"embeds\": [{
                   \"title\": \"$TITLE\",
                   \"description\": \"Video PoC generation completed with status: **$STATUS**.\n\n[Download Video Artifacts]($RUN_URL)\",
                   \"color\": $COLOR,
                   \"fields\": [
                     { \"name\": \"Repository\", \"value\": \"${{ github.repository }}\", \"inline\": true },
                     { \"name\": \"Run ID\", \"value\": \"${{ github.run_id }}\", \"inline\": true }
                   ]
                 }]
               }" "$DISCORD_WEBHOOK"
