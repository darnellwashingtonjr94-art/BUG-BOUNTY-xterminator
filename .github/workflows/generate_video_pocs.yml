
name: Generate Video PoCs Pipeline

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      start_idx:
        description: 'Start script index'
        required: false
        default: '1'
      end_idx:
        description: 'End script index'
        required: false
        default: '30'
      concurrency:
        description: 'Max parallel API requests'
        required: false
        default: '30'

jobs:
  generate-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Execute Video Pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          START_IDX: ${{ inputs.start_idx || '1' }}
          END_IDX: ${{ inputs.end_idx || '30' }}
          CONCURRENCY: ${{ inputs.concurrency || '30' }}
          DOWNLOAD_DIR: 'packages/video-gen/downloads'
        run: |
          chmod +x packages/video-gen/run_pipeline.sh
          ./packages/video-gen/run_pipeline.sh

      - name: Upload Generated Videos as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-pocs-${{ github.run_id }}
          path: packages/video-gen/downloads/*.mp4
          retention-days: 7

      - name: Send Discord Webhook Notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            COLOR=3066993
            TITLE="✅ Veo 3 Video PoC Pipeline Completed"
          else
            COLOR=15158332
            TITLE="❌ Veo 3 Video PoC Pipeline Failed"
          fi

          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "embeds": [{
                   "title": "'"$TITLE"'",
                   "description": "Video PoC generation completed with status: **'"$STATUS"'**.\n\n[📥 Download Video Artifacts]('"$RUN_URL"')",
                   "color": '$COLOR',
                   "fields": [
                     { "name": "Repository", "value": "'"${{ github.repository }}"'", "inline": true },
                     { "name": "Run ID", "value": "'"${{ github.run_id }}"'", "inline": true }
                   ]
                 }]
               }' "$DISCORD_WEBHOOK"
